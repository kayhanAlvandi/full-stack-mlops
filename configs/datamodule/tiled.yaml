_target_: src.datamodule.MultiChannelDataModule

batch_size: 64
num_workers: 0
pin_memory: true

# Label provider: _target_ selects the class, everything else is that class's
# own constructor params. Swap _target_ for utils.labels.MongoDBLabelsProvider
# or DummyLabelsProvider (or a custom provider) to change source, no code change.
label_provider:
  _target_: utils.labels.CSVLabelsProvider
  csv_path: "/mnt/O/plate_well_labels.csv"
  plate_col: Plate
  well_col: Well
  label_col: Treatment  # this export's label column is 'Treatment', not 'label'

train_val_split: 0.75
max_wells_per_label: 4
exclude_wells:
  - ["MIG-Exp03-CP-40X-bin1X1", "K07"]
  - ["MIG-Exp03-CP-40X-bin1X1", "K08"]
  - ["MIG-Exp03-CP-40X-bin1X1", "K09"]
  - ["MIG-Exp03-CP-40X-bin1X1", "K10"]
  - ["MIG-Exp03-CP-40X-bin1X1", "K11"]
  

dataset:
  _target_: src.dataset.TiledMultiChannelDataset
  root_dir: "/mnt/O/MIG-Exp03-CP-40X-bin1X1"
  channels: [1, 2, 3, 4, 5]
  crop_size: 224
  stride: null
  cache_size: 64
  max_samples_per_label: 16
  verbose: true

train_transform:
  # - name: RandomCrop
  #   size: 224
  - name: GaussianNoise
    std: 0.05
    p: 0.5
  - name: GaussianBlur
    min_kernel: 3
    max_kernel: 7
    sigma: 1.0
    p: 0.3
  - name: RandomErasing
    p: 0.3
    scale: [0.02, 0.2]
    ratio: [0.3, 3.3]
    value: zero
  - name: Normalize

val_transform:
  # - name: CenterCrop
  #   size: 224
  - name: Normalize

# Optional batch-level transform (Mixup/CutMix)
# v2.RandomChoice picks CutMix or MixUp with equal probability each batch
batch_transform:
  name: BatchMixCut
  mixup_alpha: 0.2
  cutmix_alpha: 0.4
  num_classes: 4