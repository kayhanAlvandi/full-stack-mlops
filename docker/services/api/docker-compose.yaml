services:
  api:
    image: ghcr.io/kayhanalvandi/full-stack-mlops/api:latest
    pull_policy: always
    container_name: image_classifier_api
    env_file: .env.api
    ports:
      - "8000:8000"
    volumes:
      - ${O_DRIVE_PATH}:/mnt/O:rw
      - ../../../mlflow-data/mlruns:/mnt/mlruns:ro ## for loading models fast instead of downloading from mlflow
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ml-platform
      - pg_network

networks:
  ml-platform:
    external: true
  pg_network:
    external: true
