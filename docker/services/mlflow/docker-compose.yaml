services:
  mlflow:
    image: ghcr.io/kayhanalvandi/pytorch-lightning-mlops-template/mlflow:latest
    pull_policy: always
    container_name: mlflow_server
    command: >
              mlflow server
               --backend-store-uri sqlite:////mlflow-data/mlflow.db
               --artifacts-destination /mlflow-data/mlruns
               --host 0.0.0.0
               --port 5000
               --serve-artifacts
               --allowed-hosts '*'
    ports:
      - "5000:5000"
    volumes:
      # Mount a directory, not the db file itself: single-file bind mounts on
      # Docker Desktop can silently degrade to a shadow copy where reads look
      # normal but writes never reach the host file.
      - ../../../mlflow-data:/mlflow-data
    restart: unless-stopped
    networks:
      - ml-platform

networks:
  ml-platform:
    external: true
