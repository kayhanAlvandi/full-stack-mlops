name: Tests-Training-build-image

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/training/**'
      - 'docker/jobs/train/Dockerfile'
      - '.github/workflows/ci_training.yml'
      - '.github/actions/setup-env/'
      - 'requirements/training_req.txt'
      - 'train.py'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Which test suite to run (CPU only; GPU tests run locally)'
        required: true
        default: training
        type: choice
        options:
          - training
          - integration
          - all
      image_tag:
        description: 'Tag for the training image if built (e.g. an experiment/config name)'
        required: false
        default: ''


jobs:
  # Fast CPU suite: runs automatically on push and pull_request.
  test-push-training: 
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check
          src: "src/ train.py tests/training/"
      - name: Set up Python
        uses: ./.github/actions/setup-env
        with:
          requirements_file: requirements/training_req.txt
      - name: Run tests
        run: pytest tests/training/unit -q
  # Manual suite selection via the Actions "Run workflow" button.
  # GPU tests are excluded (no CUDA on GitHub-hosted runners); run them locally.
  test-dispatch:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-env
        with:
          requirements_file: requirements/training_req.txt
      - name: Run training tests
        if: inputs.run_tests == 'training'
        run: pytest tests/training/unit -q
      - name: Run integration tests (CPU only)
        if: inputs.run_tests == 'integration'
        run: pytest tests/training/integration -q
      - name: Run all tests (CPU only)
        if: inputs.run_tests == 'all'
        run: pytest tests/training/unit tests/training/integration -q
  
  training-build-push:
    runs-on: ubuntu-latest
    needs: test-dispatch
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests == 'all'
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        uses: ./.github/actions/build-push-image
        with:
          image_name: training
          dockerfile: docker/jobs/train/Dockerfile
          extra_tag: ${{ inputs.image_tag }}
          token: ${{ secrets.GHCR_TOKEN }}
