# Template for pulling images from GHCR (ghcr.io).
#
# GHCR packages are PRIVATE by default even when the git repo is public --
# package visibility is set separately in GitHub > Packages > (package) >
# Package settings. Options:
#   A) Make each package public there -> no pull secret needed at all, delete
#      the `imagePullSecrets:` blocks from the job manifests.
#   B) Keep packages private -> create this pull secret in EVERY namespace that
#      pulls images (here: `monitoring` and `api`).
#
# Easiest way to create it (computes the auth blob correctly), run once per
# namespace with a GitHub PAT that has the `read:packages` scope:
#
#   kubectl create secret docker-registry ghcr-pull \
#     --namespace monitoring \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<PAT-with-read:packages>
#   kubectl create secret docker-registry ghcr-pull \
#     --namespace api \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<PAT-with-read:packages>
#
# If you'd rather keep it as a manifest, copy this file to
# ghcr-pull-secret.yaml (gitignored) and fill in the base64 auth blob below.
# `auth` is base64 of the literal string "<github-username>:<PAT>".
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: monitoring
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"auth":"<base64 of github-username:PAT>"}}}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: api
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"auth":"<base64 of github-username:PAT>"}}}
