# Template -- copy to monitoring-secrets.yaml and fill in real values.
# monitoring-secrets.yaml is gitignored (contains DB credentials); this file is not.
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secret
  namespace: monitoring
type: Opaque
stringData:
  # Postgres connection (same DB the API / compute-references write to)
  MONITORING_DB_URI: "postgresql://<user>:<password>@postgres.api.svc.cluster.local:5432/prediction"
