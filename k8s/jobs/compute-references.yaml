# Job
apiVersion: batch/v1
kind: Job
metadata:
    name: compute-references
    namespace: api
spec:
    backoffLimit: 2
    activeDeadlineSeconds: 3600
    template:
        spec:
            containers:
                - name: compute-references
                  image: ghcr.io/kayhanalvandi/pytorch-lightning-mlops-template/api:latest
                  # IfNotPresent instead of the :latest-tag default (Always) --
                  # trust whatever's already loaded on the node (e.g. via
                  # `kind load docker-image`) instead of re-pulling from GHCR
                  # and silently discarding a locally-tested, not-yet-pushed
                  # build. Switch back to Always once this image is routinely
                  # pushed by CI and you want every run to pick up the latest.
                  imagePullPolicy: IfNotPresent
                  command: ["python", "-m", "monitoring.compute_predictions_references"]
                  envFrom:
                    - configMapRef:
                        name: api-config
                    - secretRef:
                        name: api-secrets
                  volumeMounts:
                    - name: o-drive
                      mountPath: /mnt/O
            volumes:
              - name: o-drive
                hostPath:
                  path: /mnt/o-drive
            restartPolicy: Never
